<section
    class="relative min-h-screen flex flex-col items-center justify-center py-50 text-center overflow-hidden bg-gray-50 dark:bg-brand-dark transition-colors duration-500">

    <canvas #plasmaCanvas
        class="absolute inset-0 w-full h-full z-0 opacity-60 dark:opacity-40 pointer-events-none"></canvas>

    <div class="relative z-10 px-4 pointer-events-none select-none">
        <h1 class="text-3xl md:text-5xl font-bold tracking-tighter leading-tight mb-8 pointer-events-auto"
            data-aos="fade-right">
            {{languageService.t().hero.greeting}} <span class="text-blue-600 dark:text-blue-600">Maitén Blanc</span>.
        </h1>

        <p class="text-2xl text-gray-500 dark:text-gray-400 max-w-4xl mx-auto pointer-events-auto" data-aos="fade-left">
            {{languageService.t().hero.role}} <br>
            {{languageService.t().hero.student}} <br>
        </p>

    </div>

    <div class="absolute bottom-10 left-0 w-full z-10 flex justify-center pointer-events-auto" data-aos="fade-up"
        data-aos-delay="800">
        <app-scroll-arrow targetId="about" label="{{languageService.t().hero.btn}}"></app-scroll-arrow>
    </div>

</section>
