<section id="about" class="py-10 md:py-20 px-4 md:px-6 scroll-mt-5 overflow-hidden">

  <div class="max-w-6xl mx-auto">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-16 items-center">

      <div class="relative group max-w-sm mx-auto" data-aos="fade-right">
        <div
          class="absolute inset-0 bg-blue-600/20 translate-x-4 translate-y-4 rounded-sm transition-transform duration-500 group-hover:translate-x-2 group-hover:translate-y-2">
        </div>

        <div class="relative overflow-hidden rounded-sm aspect-[2/2] md:aspect-[4/5] bg-gray-200 dark:bg-gray-800">
          <img [src]="about.image" alt="Foto de perfil"
            class="w-full h-full object-cover grayscale transition-all duration-700 hover:grayscale-0 hover:scale-105">
        </div>
      </div>

      <div data-aos="fade-left">
        <h2 class="text-xl font-bold tracking-[0.2em] uppercase text-blue-600 mb-4">
          {{languageService.t().about.title}}
        </h2>

        <div [innerHTML]="languageService.t().about.description"
          class="text-gray-600 dark:text-gray-400 text-lg leading-relaxed mb-8">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-6 border-t border-gray-200 dark:border-gray-800">
          <div>
            <h4 class="text-sm font-bold uppercase tracking-wider text-gray-900 dark:text-white mb-1">
              {{languageService.t().about.education}}</h4>
            <p class="text-gray-500 text-sm">{{languageService.t().about.career1}}</p>
            <p class="text-gray-500 text-sm">{{languageService.t().about.career2}}</p>
            <p class="text-gray-500 text-sm">{{languageService.t().about.university}}</p>
          </div>
          <div>
            <h4 class="text-sm font-bold uppercase tracking-wider text-gray-900 dark:text-white mb-1">
              {{languageService.t().about.location}}</h4>
            <p class="text-gray-500 text-sm">{{ about.location }}</p>
          </div>
        </div>

        <div class="mt-8 flex justify-end"> <a href="{{languageService.t().about.cvSite}}" target="_blank" class="group relative overflow-hidden inline-flex items-center px-8 py-4 font-bold tracking-widest text-sm uppercase
                      text-black dark:text-white transition-colors duration-500 
                      hover:text-white dark:hover:text-black cursor-pointer">

            <span class="absolute bottom-0 left-0 w-full h-[2px] bg-blue-600 dark:bg-blue-600 z-0
                             transition-all duration-500 ease-out group-hover:h-full"></span>

            <span class="relative z-10 flex items-center gap-2">
              {{languageService.t().about.cv}}
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
              </svg>
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3 md:mt-10 flex justify-center">
    <app-scroll-arrow targetId="projects" label="{{languageService.t().about.btn}}"></app-scroll-arrow>
  </div>

</section>
