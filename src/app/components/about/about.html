<section id="about" class="py-10 md:py-20 px-4 md:px-6 scroll-mt-5 overflow-hidden">
  <div class="max-w-6xl mx-auto">
    
    <!-- Título integrado dentro del contenedor general y alineado a la izquierda en desktop -->
    <h2 class="text-3xl font-bold text-center mb-10 md:mb-16 dark:text-white">
      {{ languageService.t().about.title }}
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-5 gap-10 md:gap-16 items-center">

      <!-- CONTENEDOR DE IMAGEN -->
      <div class="md:col-span-2 pr-4 pb-4 md:pr-0 md:pb-0" data-aos="fade-right">
        <div class="relative group max-w-[280px] sm:max-w-sm mx-auto w-full">
          <div class="absolute inset-0 bg-blue-600/20 translate-x-3 translate-y-3 rounded-sm transition-transform duration-500 group-hover:translate-x-1 group-hover:translate-y-1
            lg:translate-x-4 lg:translate-y-4">
          </div>

          <!-- Foto de perfil -->
          <div class="relative overflow-hidden rounded-sm aspect-[2/2] md:aspect-[4/5] bg-gray-200 dark:bg-gray-800">
            <img [src]="about.image" alt="Foto de perfil"
              class="w-full h-full object-cover grayscale transition-all duration-700 hover:grayscale-0 hover:scale-105" />
          </div>

        </div>
      </div>

      <!-- CONTENEDOR DE TEXTO -->
      <div class="md:col-span-3" data-aos="fade-left">

        <div [innerHTML]="languageService.t().about.profileData.description"
          class="text-gray-600 dark:text-gray-400 text-lg leading-relaxed mb-8"></div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 lg:gap-8 pt-6 border-t border-gray-200 dark:border-gray-800">
          <div>
            <h4 class="text-sm font-bold uppercase tracking-wider text-gray-900 dark:text-white mb-1">
              {{ languageService.t().about.education }}
            </h4>
            <p class="text-gray-500 text-sm" [innerHTML]="languageService.t().about.profileData.education"></p>
          </div>
          <div>
            <h4 class="text-sm font-bold uppercase tracking-wider text-gray-900 dark:text-white mb-1">
              {{ languageService.t().about.location }}
            </h4>
            <p class="text-gray-500 text-sm">
              {{ languageService.t().about.profileData.location }}
            </p>
          </div>
        </div>

        <!-- Botón con alineación adaptativa (izquierda en tablet, derecha en sm/desktop) -->
        <div class="mt-8 flex justify-start sm:justify-end">
          <a href="{{ languageService.t().about.cvSite }}" target="_blank"
            class="group relative overflow-hidden inline-flex items-center px-8 py-4 font-bold tracking-widest text-sm uppercase text-black dark:text-white transition-colors duration-500 hover:text-white dark:hover:text-black cursor-pointer">
            <span
              class="absolute bottom-0 left-0 w-full h-[2px] bg-blue-600 dark:bg-blue-600 z-0 transition-all duration-500 ease-out group-hover:h-full"></span>

            <span class="relative z-10 flex items-center gap-2">
              {{ languageService.t().about.cv }}
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
              </svg>
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-10 md:mt-16 flex justify-center">
    <app-scroll-arrow targetId="projects" label="{{ languageService.t().about.btn }}"></app-scroll-arrow>
  </div>
</section>
